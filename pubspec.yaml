name: convertix
description: "Convertix - All Format Media & Document Converter"
publish_to: 'none'

version: 1.0.9+16

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.3
  ffmpeg_kit_flutter_new: ^4.6.0
  google_mobile_ads: ^5.3.0
  dio: ^5.7.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  open_file: ^3.5.8
  share_plus: ^10.1.4
  image: ^4.3.0
  lucide_icons_flutter: ^3.1.15
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  uuid: ^4.6.0
  path: ^1.9.0
  # Split PDF only: the backend returns a ZIP of per-page PDFs, which is decoded
  # on-device so the user never handles the archive. See STATE.md open question 6.
  archive: ^3.6.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - .env
